function drawZombie (x, y) {
    rectangle(x + 3, y - 10, 23, 65, "lightgreen")
    rectangle(x + 3, y - 25, 23, 65, "grey")
    circle(x + 15, y - 40, 20, "lightgreen")
    circle(x, y - 40, 3, "red")
    rectangle(x - 35, y - 20, 30, 14, "lightgreen")
    rectangle(x-20, y - 20, 30, 14, "grey")
}
function drawPlayer() {
    circle(player.x, player.y, player.size, player.color);
    circle(player.x - 10, player.y, 5, "red")
    circle(player.x + 10, player.y, 5, "red")
}

    player.x = player.x + player.speed;
