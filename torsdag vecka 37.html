 var player = { 
  x:50, 
  y: 200, 
  size: 40, 
  color: "blue", 
  speedX: 10, 
  direction: 1,
  bounces: 0
};
var x = 0
 function update() {
  clearScreen();
 
  text(50, 50, 40, "Antal: " + player.bounces, "white")
 
  picture(x, 0, "https://images6.alphacoders.com/860/860645.png", totalWidth * 2, totalHeight)
  x--
 text(50, 50, 40, "Antal: " + player.bounces, "white")
 
  circle(player.x, player.y, player.size, player.color);
  player.x = player.x + player.speedX * player.direction

 if(player.x + player.size > totalWidth) {
  player.direction = -1
  player.color = "red"
  player.size = 80
  player.bounces++
   
 }

if(player.x - player.size < 0) {
  //console.log("träff på vänster")
  player.direction = 1
  player.color = "green"
  player.size = 20
  player.speedX = 20

}



 
}
